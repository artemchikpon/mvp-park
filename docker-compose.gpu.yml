# Распознавание лиц на видеокарте NVIDIA, CPU-воркер — подстраховка.
# Запуск поверх основного файла:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# worker-gpu берёт кадры всегда. CPU-воркер (overflow) подключается, только
# когда очередь копится (GPU не успевает или упал).
#
# Нужно: видеокарта NVIDIA, драйвер с CUDA >= 12.6, NVIDIA Container Toolkit
# (Linux) или Docker Desktop с WSL2 (Windows). Проверка:
#   docker run --rm --gpus all nvidia/cuda:12.6.2-base-ubuntu22.04 nvidia-smi

services:

  worker:
    environment:
      WORKER_ROLE: overflow
    deploy:
      replicas: 1

  worker-gpu:
    build:
      context: .
      dockerfile: services/worker/Dockerfile.gpu
    env_file: .env
    environment:
      FACE_DEVICE: gpu
      WORKER_ROLE: primary
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
