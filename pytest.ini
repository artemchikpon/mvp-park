[pytest]
# В Docker-образах PYTHONPATH настраивается так, чтобы shared/db и services/*
# были плоскими top-level пакетами (см. services/*/Dockerfile: ENV PYTHONPATH=...).
# Здесь делаем то же самое для тестов через conftest.py (sys.path), а не через
# pytest.ini rootdir-магию, чтобы поведение совпадало с реальным контейнером.
testpaths = tests
python_files = test_*.py
