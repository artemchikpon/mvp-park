# Все адреса, пароли и секреты — в файле .env (шаблон: .env.example).
# Остальные настройки имеют значения по умолчанию в коде (таблица в README);
# чтобы поменять какую-то из них — допишите её в .env.

services:

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    # Postgres 15 + pgvector (поиск похожих лиц в базе).
    # trixie — та же glibc, что у postgres:15, поэтому старый том pgdata подходит.
    image: pgvector/pgvector:0.8.1-pg15-trixie
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  migrator:
    build:
      context: .
      dockerfile: shared/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: services/producer/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  pgdata:
