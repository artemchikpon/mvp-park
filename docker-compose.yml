version: "3.9"

# Общие настройки, переиспользуемые сервисами через YAML-якоря.
x-db-env: &db-env
  DATABASE_URL: postgresql://face:face@postgres:5432/face_db

x-app-env: &app-env
  <<: *db-env
  REDIS_HOST: redis
  # Сводка производительности в логах раз в N секунд (0 — выключить)
  PERF_LOG_INTERVAL: "${PERF_LOG_INTERVAL:-30}"

x-hr-env: &hr-env
  HR_API_BASE: "https://central-park.rzbtech.uz"
  HR_SSL_VERIFY: "true"

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrator:
    condition: service_completed_successfully

services:

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: face
      POSTGRES_PASSWORD: face
      POSTGRES_DB: face_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U face -d face_db" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  migrator:
    build:
      context: .
      dockerfile: shared/Dockerfile
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: [*app-env, *hr-env]
      ENABLE_DOCS: "true"
      # CORS_ORIGINS можно передать через .env, например:
      # https://dashboard.example.com,https://admin.example.com
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      # ВАЖНО: заменить на реальные секреты перед продом (например, через
      # .env файл / docker secret, не хранить в git).
      API_KEYS: "${API_KEYS:?Задайте API_KEYS в .env — см. auth.py}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *app-depends
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: services/producer/Dockerfile
    environment:
      <<: *app-env
      # Не больше N кадров в секунду с каждой камеры в Redis (0 — без ограничения)
      PRODUCER_MAX_FPS: "${PRODUCER_MAX_FPS:-5}"
    depends_on: *app-depends
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      <<: [*app-env, *hr-env]
      CROSSING_COOLDOWN_SECONDS: "60"
      PERSONS_RESET_HOUR: "0"
      PERSONS_RESET_MINUTE: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *app-depends
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  pgdata:
